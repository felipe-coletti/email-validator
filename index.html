<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Validação de e-mail</title>
		<link rel="stylesheet" href="css/style.css" />
		<script type="module" src="js/main.js" defer></script>
	</head>
	<body>
		<main id="main">
			<div id="container">
				<h1 id="title">Validação de e-mail</h1>
				<form id="form">
					<label id="label" for="input">
						E-mail
						<input type="email" id="input" />
                        <span id="result" role="status" aria-live="polite" hidden></span>
					</label>
					<button type="submit" id="button">Verificar</button>
				</form>
			</div>
		</main>
	</body>
</html>
